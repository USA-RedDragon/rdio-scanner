version: "2"

run:
  timeout: 30m

linters:
  exclusions:
    # ent-generated files carry a "Code generated" header; skip them, plus
    # generated and test files (the previous config skipped these too).
    generated: lax
    paths:
      - '.*_gen\.go$'
      - '.*_gen_test\.go$'
      - '.*_test\.go$'
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - containedctx
    - contextcheck
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godox
    - gomoddirectives
    - gosec
    - grouper
    - loggercheck
    - misspell
    - nilerr
    - nilnil
    - noctx
    - nosprintfhostport
    - paralleltest
    - prealloc
    - predeclared
    - reassign
    - revive
    - testpackage
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace

formatters:
  enable:
    - gci
    - gofmt
